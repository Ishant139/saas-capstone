server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # API + health endpoints go to the Node container
  location /api/ { proxy_pass http://api:5000; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Forwarded-For $remote_addr; }
  location = /healthz { proxy_pass http://api:5000; }

  # Hashed build assets: cache for a year
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  # SPA fallback
  location / { try_files $uri /index.html; }
}
