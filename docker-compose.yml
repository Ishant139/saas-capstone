# Local parity: `docker compose up --build` -> http://localhost:8080
services:
  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./server
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/saas
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CLIENT_ORIGIN: http://localhost:8080
    depends_on:
      mongo: { condition: service_healthy }
    restart: unless-stopped

  web:            # React static build served by Nginx, which also proxies /api to `api`
    build: ./client
    ports: ["8080:80"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  mongo_data:
